# SPIRE server: issues SVIDs for the trust domain. Settings (trust domain,
# jwt_issuer, cluster name) come from the spire-settings ConfigMap, which
# scripts/spire.sh creates from config.env.
apiVersion: v1
kind: Namespace
metadata:
  name: spire
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire
---
# Filled in by the server's k8sbundle notifier; the agents bootstrap from it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server
rules:
# k8s_psat node attestation validates agent tokens and looks up their pod and node.
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server
subjects:
- kind: ServiceAccount
  name: spire-server
  namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-bundle
  namespace: spire
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["spire-bundle"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-bundle
  namespace: spire
subjects:
- kind: ServiceAccount
  name: spire-server
  namespace: spire
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-bundle
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "${TRUST_DOMAIN}"
      data_dir = "/run/spire/data"
      log_level = "INFO"

      # The iss claim; must match the issuer registered with Anthropic.
      jwt_issuer = "${JWT_ISSUER}"
      default_jwt_svid_ttl = "5m"
      default_x509_svid_ttl = "1h"

      # Signing keys (X.509 CA and JWT) live 90 days, so the JWKS you publish
      # stays valid through rehearsals and the talk. Production would rotate
      # much faster and serve the JWKS from the OIDC Discovery Provider.
      ca_ttl = "2160h"
      ca_subject {
        country = ["HU"]
        organization = ["KCD Budapest demo"]
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "${CLUSTER_NAME}" = {
              service_account_allow_list = ["spire:spire-agent"]
            }
          }
        }
      }

      Notifier "k8sbundle" {
        plugin_data {
          namespace = "spire"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      containers:
      - name: spire-server
        image: ghcr.io/spiffe/spire-server:1.15.5
        args: ["-config", "/run/spire/config/server.conf", "-expandEnv"]
        envFrom:
        - configMapRef:
            name: spire-settings
        ports:
        - containerPort: 8081
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /run/spire/config
          readOnly: true
        - name: data
          mountPath: /run/spire/data
      volumes:
      - name: config
        configMap:
          name: spire-server
      # A kind extraMount from the VM; see kind/cluster.yaml.
      - name: data
        hostPath:
          path: /var/lib/spire-server
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
  - name: grpc
    port: 8081
    targetPort: 8081
