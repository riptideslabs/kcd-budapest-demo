# The egress proxy injector: a mutating admission webhook that adds the
# egress-proxy sidecar to every pod created in a namespace labeled
# egress-proxy=enabled.
apiVersion: v1
kind: Namespace
metadata:
  name: egress-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-injector
  namespace: egress-system
---
# The injector writes its CA into its own webhook configuration, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: egress-injector
rules:
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  resourceNames: ["egress-proxy-injector"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: egress-injector
subjects:
- kind: ServiceAccount
  name: egress-injector
  namespace: egress-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: egress-injector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-injector
  namespace: egress-system
spec:
  # One replica: each replica makes its own serving CA.
  replicas: 1
  selector:
    matchLabels:
      app: egress-injector
  template:
    metadata:
      labels:
        app: egress-injector
    spec:
      serviceAccountName: egress-injector
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: injector
        image: egress-injector:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROXY_IMAGE
          value: egress-proxy:dev
        # Each opted-in namespace holds its Anthropic IDs in this ConfigMap.
        - name: WIF_CONFIGMAP
          value: anthropic-wif
        ports:
        - containerPort: 8443
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8443
            scheme: HTTPS
          periodSeconds: 2
        securityContext:
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: egress-injector
  namespace: egress-system
spec:
  selector:
    app: egress-injector
  ports:
  - port: 443
    targetPort: 8443
---
# caBundle is filled in by the injector at startup.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: egress-proxy-injector
webhooks:
- name: inject.egress-proxy.kcd-demo
  admissionReviewVersions: ["v1"]
  sideEffects: None
  # A pod that asked for the proxy and can't get it shouldn't start without it.
  failurePolicy: Fail
  reinvocationPolicy: Never
  timeoutSeconds: 5
  clientConfig:
    service:
      name: egress-injector
      namespace: egress-system
      path: /mutate
  namespaceSelector:
    matchLabels:
      egress-proxy: enabled
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
